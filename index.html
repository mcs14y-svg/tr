<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plataforma Escolar Segura</title>

<!-- GOOGLE AUTH -->
<!-- COLE SEU GOOGLE AUTH CLIENT ID ABAIXO -->
<meta name="google-signin-client_id" content="COLE_AQUI_SEU_GOOGLE_CLIENT_ID">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --primary:#0D2B52;
    --primary-light:#17457D;
    --secondary:#C8A96B;
    --background:#F4F7FB;
    --card:#FFFFFF;
    --text:#1B1F24;
    --text-light:#6B7280;
    --border:#E5E7EB;
    --success:#1E8449;
    --warning:#D68910;
    --danger:#C0392B;
    --shadow:0 10px 30px rgba(0,0,0,0.08);
    --radius:18px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:var(--background);
    color:var(--text);
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:260px;
    background:linear-gradient(180deg,#0D2B52,#081C36);
    padding:28px;
    color:white;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:40px;
}

.logo-shape{
    width:46px;
    height:46px;
    border-radius:14px;
    background:var(--secondary);
}

.logo h1{
    font-size:18px;
    line-height:1.3;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.menu button{
    background:rgba(255,255,255,0.08);
    border:none;
    color:white;
    padding:14px;
    border-radius:14px;
    text-align:left;
    cursor:pointer;
    transition:0.2s;
    font-size:15px;
    font-weight:500;
}

.menu button:hover{
    background:rgba(255,255,255,0.15);
}

.main{
    margin-left:260px;
    padding:32px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.topbar h2{
    font-size:30px;
    color:var(--primary);
}

.topbar p{
    color:var(--text-light);
    margin-top:6px;
}

.profile{
    background:white;
    padding:12px 18px;
    border-radius:14px;
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    gap:12px;
}

.profile-circle{
    width:42px;
    height:42px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:22px;
    margin-bottom:28px;
}

.card{
    background:white;
    border-radius:var(--radius);
    padding:24px;
    box-shadow:var(--shadow);
}

.stat-card{
    position:relative;
    overflow:hidden;
}

.stat-card::before{
    content:'';
    position:absolute;
    left:0;
    top:0;
    width:6px;
    height:100%;
    background:var(--secondary);
}

.stat-title{
    font-size:14px;
    color:var(--text-light);
    margin-bottom:10px;
}

.stat-number{
    font-size:36px;
    font-weight:700;
    color:var(--primary);
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.section-title h3{
    font-size:22px;
}

button{
    border:none;
    cursor:pointer;
    transition:0.2s;
    font-family:'Inter',sans-serif;
}

.primary-btn{
    background:var(--primary);
    color:white;
    padding:13px 18px;
    border-radius:12px;
    font-weight:600;
}

.primary-btn:hover{
    background:var(--primary-light);
}

.secondary-btn{
    background:var(--secondary);
    color:white;
    padding:13px 18px;
    border-radius:12px;
    font-weight:600;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
}

.input-group{
    display:flex;
    flex-direction:column;
}

.input-group label{
    font-size:14px;
    font-weight:600;
    margin-bottom:8px;
    color:var(--text-light);
}

.input-group input,
.input-group select{
    padding:14px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#FAFBFC;
    font-size:15px;
    outline:none;
}

.input-group input:focus,
.input-group select:focus{
    border-color:var(--primary);
}

.table-wrapper{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

table thead{
    background:#F8FAFC;
}

table th,
table td{
    padding:16px;
    text-align:left;
    border-bottom:1px solid var(--border);
    font-size:14px;
}

table th{
    color:var(--text-light);
    font-weight:600;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
}

.status::before{
    content:'';
    width:10px;
    height:10px;
    border-radius:50%;
}

.active{
    background:#E8F8EF;
    color:#1E8449;
}

.active::before{
    background:#1E8449;
}

.review{
    background:#FFF4E5;
    color:#D68910;
}

.review::before{
    background:#D68910;
}

@media(max-width:900px){

    .sidebar{
        position:relative;
        width:100%;
        height:auto;
    }

    .main{
        margin-left:0;
    }

    .topbar{
        flex-direction:column;
        align-items:flex-start;
        gap:18px;
    }

}

</style>

</head>

<body>

<!-- ====================================== -->
<!-- COLE SUA URL DO APPS SCRIPT AQUI -->
<!-- ====================================== -->

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxPemXNAIcAc-a1G2Kx7Py-66qxD0uzsIFwLyf5u8jOc3q2u4SqYiyPdmwEY-AioAqLnA/exec";

</script>

<div class="sidebar">

<div class="logo">
<div class="logo-shape"></div>

<h1>
Plataforma Escolar
</h1>
</div>

<div class="menu">

<button>Dashboard</button>

<button>Registros</button>

<button>Turmas</button>

<button>Usuários</button>

<button>Relatórios</button>

</div>

</div>

<div class="main">

<div class="topbar">

<div>

<h2>Dashboard Institucional</h2>

<p>
Sistema seguro de acompanhamento educacional
</p>

</div>

<div class="profile">

<div class="profile-circle"></div>

<div>

<b>Administrador</b><br>

<small>Sistema Institucional</small>

</div>

</div>

</div>

<!-- ESTATÍSTICAS -->

<div class="grid">

<div class="card stat-card">

<div class="stat-title">
Total de Registros
</div>

<div class="stat-number" id="totalRegistros">
0
</div>

</div>

<div class="card stat-card">

<div class="stat-title">
Turmas Ativas
</div>

<div class="stat-number" id="totalTurmas">
0
</div>

</div>

<div class="card stat-card">

<div class="stat-title">
Usuários
</div>

<div class="stat-number" id="totalUsuarios">
0
</div>

</div>

</div>

<!-- NOVO REGISTRO -->

<div class="card">

<div class="section-title">

<h3>Novo Registro</h3>

<button class="primary-btn" onclick="createRecord()">
Salvar Registro
</button>

</div>

<div class="form-grid">

<div class="input-group">

<label>Segmento</label>

<select id="segmento">

<option>Fundamental</option>

<option>Médio</option>

<option>High School</option>

</select>

</div>

<div class="input-group">

<label>Série</label>

<input type="text" id="serie" placeholder="Ex: 7º Ano">

</div>

<div class="input-group">

<label>Turma</label>

<input type="text" id="turma" placeholder="Ex: A">

</div>

<div class="input-group">

<label>Categoria</label>

<select id="categoria">

<option>Atenção</option>

<option>Comunicação</option>

<option>Aprendizagem</option>

<option>Mobilidade</option>

<option>Comportamento</option>

<option>Altas habilidades</option>

<option>Outro</option>

</select>

</div>

<div class="input-group">

<label>Nível</label>

<select id="nivel">

<option>Baixo</option>

<option>Médio</option>

<option>Alto</option>

</select>

</div>

<div class="input-group">

<label>Status</label>

<select id="status">

<option>Ativo</option>

<option>Em análise</option>

<option>Revisar</option>

<option>Encerrado</option>

</select>

</div>

</div>

</div>

<!-- REGISTROS -->

<div class="card">

<div class="section-title">

<h3>Registros Recentes</h3>

<button class="secondary-btn" onclick="loadDashboard()">
Atualizar Dados
</button>

</div>

<div class="table-wrapper">

<table>

<thead>

<tr>

<th>ID</th>
<th>Segmento</th>
<th>Série</th>
<th>Turma</th>
<th>Categoria</th>
<th>Nível</th>
<th>Status</th>

</tr>

</thead>

<tbody id="recordsTable">

</tbody>

</table>

</div>

</div>

</div>

<script>

function sanitize(text){

    if(!text) return "";

    return text
    .replace(/[<>"'`;()]/g,"")
    .trim();
}

async function loadDashboard(){

    try{

        const response = await fetch(API_URL,{

            method:"POST",

            body:JSON.stringify({
                action:"dashboard"
            })

        });

        const data = await response.json();

        document.getElementById("totalRegistros")
        .innerText = data.totalRegistros || 0;

        document.getElementById("totalTurmas")
        .innerText = data.totalTurmas || 0;

        document.getElementById("totalUsuarios")
        .innerText = data.totalUsuarios || 0;

        renderTable(data.records || []);

    }catch(error){

        console.log(error);

        alert("Erro ao carregar dashboard");
    }
}

function renderTable(records){

    let html = "";

    records.forEach(record=>{

        html += `

        <tr>

        <td>${record.id}</td>

        <td>${record.segmento}</td>

        <td>${record.serie}</td>

        <td>${record.turma}</td>

        <td>${record.categoria}</td>

        <td>${record.nivel}</td>

        <td>
        <span class="status active">
        ${record.status}
        </span>
        </td>

        </tr>

        `;
    });

    document.getElementById("recordsTable")
    .innerHTML = html;
}

async function createRecord(){

    const body = {

        action:"createRecord",

        segmento:sanitize(
            document.getElementById("segmento").value
        ),

        serie:sanitize(
            document.getElementById("serie").value
        ),

        turma:sanitize(
            document.getElementById("turma").value
        ),

        categoria:sanitize(
            document.getElementById("categoria").value
        ),

        nivel:sanitize(
            document.getElementById("nivel").value
        ),

        status:sanitize(
            document.getElementById("status").value
        )
    };

    try{

        const response = await fetch(API_URL,{

            method:"POST",

            body:JSON.stringify(body)

        });

        const data = await response.json();

        alert(data.message);

        loadDashboard();

    }catch(error){

        console.log(error);

        alert("Erro ao criar registro");
    }
}

loadDashboard();

</script>

</body>
</html>
